name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.routing.outputs.web }}
      mobile: ${{ steps.routing.outputs.mobile }}
      python: ${{ steps.routing.outputs.python }}
      docs: ${{ steps.routing.outputs.docs }}
      architecture: ${{ steps.routing.outputs.architecture }}
    steps:
      - name: Check out candidate with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Check out protected CI controls
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted-ci

      - uses: actions/setup-node@v7
        with:
          node-version-file: "trusted-ci/.nvmrc"
          package-manager-cache: false

      - name: Classify changed paths with protected controls
        id: routing
        working-directory: candidate
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node ../trusted-ci/scripts/ci-routing.mjs classify >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate toolchain alignment
        run: npm run toolchain:check

      - name: Type check
        run: npm run typecheck

  mobile:
    name: Mobile Foundation
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate mobile foundation
        run: npm run mobile:check

  architecture:
    name: Architecture Boundaries
    needs: changes
    if: needs.changes.outputs.architecture == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check architecture
        run: npm run arch

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation links
        run: npm run docs:check

  build:
    name: Production Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LOCAL_MODE: "true"
      NEXT_PUBLIC_LOCAL_MODE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build local-mode production bundle
        run: npm run build

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  browser:
    name: Browser and Accessibility Smoke Tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser smoke tests
        run: npm run test:e2e

  python:
    name: Python (TTS function)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.txt

      - name: Validate function imports
        run: |
          . .venv/bin/activate
          python -c "from _python.tts import handler, _generate, _VOICE_RE; print('_python/tts.py OK')"

      - name: Run Python unit tests
        run: |
          . .venv/bin/activate
          python -m unittest discover _python -p 'test_*.py'

      - name: Lint with ruff
        run: |
          . .venv/bin/activate
          python -m pip install ruff
          python -m ruff check _python/

  required:
    name: Required CI
    if: always()
    needs:
      - changes
      - lint
      - typecheck
      - mobile
      - architecture
      - docs
      - build
      - test
      - browser
      - python
    runs-on: ubuntu-latest
    steps:
      - name: Check out protected CI controls
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted-ci

      - uses: actions/setup-node@v7
        with:
          node-version-file: "trusted-ci/.nvmrc"
          package-manager-cache: false

      - name: Verify every selected gate with protected controls
        env:
          CI_RESULT_CLASSIFIER: ${{ needs.changes.result }}
          CI_ROUTE_WEB: ${{ needs.changes.outputs.web }}
          CI_ROUTE_MOBILE: ${{ needs.changes.outputs.mobile }}
          CI_ROUTE_PYTHON: ${{ needs.changes.outputs.python }}
          CI_ROUTE_DOCS: ${{ needs.changes.outputs.docs }}
          CI_ROUTE_ARCHITECTURE: ${{ needs.changes.outputs.architecture }}
          CI_RESULT_LINT: ${{ needs.lint.result }}
          CI_RESULT_TYPECHECK: ${{ needs.typecheck.result }}
          CI_RESULT_MOBILE: ${{ needs.mobile.result }}
          CI_RESULT_ARCHITECTURE: ${{ needs.architecture.result }}
          CI_RESULT_DOCS: ${{ needs.docs.result }}
          CI_RESULT_BUILD: ${{ needs.build.result }}
          CI_RESULT_TEST: ${{ needs.test.result }}
          CI_RESULT_BROWSER: ${{ needs.browser.result }}
          CI_RESULT_PYTHON: ${{ needs.python.result }}
        run: node trusted-ci/scripts/ci-routing.mjs verify
